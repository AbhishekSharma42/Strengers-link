services:
  - type: web
    name: stranger-chat-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://stranger-chat-web.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"

  - type: static
    name: stranger-chat-web
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_SERVER_URL
        value: https://stranger-chat-server.onrender.com
